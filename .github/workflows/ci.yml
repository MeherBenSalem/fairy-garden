# Builds the Forge 1.20.1 jar and checks that it runs: the mod's GameTests (runGameTestServer), the world-generation
# self test (runWorldgenTest: finds every biome and structure on seed "fairygarden", generates them and counts what was
# placed), a real Forge dedicated server booted with the built jar and TerraBlender on a normal world that generates
# every biome and structure (scripts/server-boot-test.sh), and a real client that visits every biome and structure,
# screenshots them and quits (runSnapshots). Runs on pull requests, by hand, and from the Build release jar workflow.
# It never publishes anything.

name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Check the jar
        run: |
          set -e
          V=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          name="fairygarden-forge-$MC-$V.jar"
          jar="build/libs/$name"
          ls -la build/libs
          [ -f "$jar" ] || { echo "Missing $jar"; exit 1; }
          dir=$(mktemp -d); unzip -q "$jar" -d "$dir"
          grep -q "Implementation-Version: $V" "$dir/META-INF/MANIFEST.MF" || { echo "Manifest is not $V"; exit 1; }
          grep -q 'modId="fairygarden"' "$dir/META-INF/mods.toml" || { echo "mods.toml has no fairygarden"; exit 1; }
          grep -q "version=\"$V\"" "$dir/META-INF/mods.toml" || { echo "mods.toml version is not $V"; exit 1; }
          grep -q 'modId="terrablender"' "$dir/META-INF/mods.toml" || { echo "mods.toml doesn't require TerraBlender"; exit 1; }
          [ ! -d "$dir/com/sugarplumstudios/fairygarden/client/dev" ] || { echo "The snapshot and showcase tools are in the jar"; exit 1; }
          [ -f "$dir/com/sugarplumstudios/fairygarden/FairyGarden.class" ] || { echo "No FairyGarden class"; exit 1; }
          [ -f "$dir/data/fairygarden/worldgen/biome/blossom_valley.json" ] || { echo "No generated worldgen data"; exit 1; }
          [ ! -d "$dir/.cache" ] || { echo "The datagen cache is in the jar"; exit 1; }
          find "$dir/com" -name '*.class' -exec strings {} + | grep -q -E '^(m|f)_[0-9]+_$' || { echo "The jar is not SRG-mapped"; exit 1; }
          echo "OK $name $(stat -c %s "$jar") bytes, $(ls $dir/assets/fairygarden/blockstates | wc -l) blockstates"
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/fairygarden-forge-*.jar

  gametests:
    name: GameTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run the GameTests
        timeout-minutes: 25
        run: ./gradlew createSrgToMcp runGameTestServer --stacktrace

  worldgen:
    name: World generation self test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Find, generate and count every biome and structure
        timeout-minutes: 40
        run: ./gradlew createSrgToMcp runWorldgenTest --stacktrace
      - name: Check the report
        run: |
          cat run/fairygarden-selftest.txt
          [ ! -d run/crash-reports ] || { head -150 run/crash-reports/*.txt; exit 1; }
          tail -1 run/fairygarden-selftest.txt | grep -q "RESULT: PASS" || { echo "The self test did not pass"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldgen-selftest
          path: |
            run/fairygarden-selftest.txt
            run/fairygarden-biome-map.png
            run/logs/latest.log
            run/crash-reports/**
          if-no-files-found: ignore

  server-test:
    name: Server boot test with the built jar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: jar
      - run: chmod +x scripts/server-boot-test.sh
      - name: Boot a Forge server, place every block and generate every biome and structure
        timeout-minutes: 30
        run: scripts/server-boot-test.sh jar/fairygarden-forge-*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-boot-test
          path: |
            build/boot-test-server/boot.log
            build/boot-test-server/logs/**
            build/boot-test-server/crash-reports/**
          if-no-files-found: ignore

  client-test:
    name: Client launch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - run: chmod +x gradlew
      - name: Launch the client, visit every biome and structure, screenshot them and quit
        timeout-minutes: 45
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +extension RENDER" sh -c 'glxinfo -B | head -20; ./gradlew createSrgToMcp runSnapshots -PshotSize=1920x1080 --stacktrace'
      - name: Check the screenshots and the log
        run: |
          set -e
          ls -la run/screenshots || true
          n=$(ls run/screenshots/fairygarden_*.png 2>/dev/null | wc -l)
          echo "$n screenshots"
          [ ! -d run/crash-reports ] || { head -150 run/crash-reports/*.txt; exit 1; }
          for s in blossom_valley_day lavender_fields_day strawberry_meadow_day moonlight_forest_day moonlight_forest_night fairy_glade_day fairy_glade_night flower_shrine hidden_fairy_garden moonstone_circle mushroom_cottage gallery_day gallery_night; do
            [ -f "run/screenshots/fairygarden_$s.png" ] || { echo "Missing the $s screenshot"; exit 1; }
          done
          grep -q "\[devshots\] finished, quitting" run/logs/latest.log || { echo "The snapshot tour did not finish"; exit 1; }
          if grep -E "ERROR|Exception|Caused by" run/logs/latest.log | grep -E 'com\.sugarplumstudios|fairygarden[:.]|\[devshots\] step'; then echo "The log has errors naming Fairy Garden"; exit 1; fi
      - name: Errors in the log
        if: always()
        run: grep -n -E "ERROR|Exception|Caused by|at com\.sugarplum|\[devshots\]" run/logs/latest.log | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test
          path: |
            run/screenshots/**
            run/logs/latest.log
            run/crash-reports/**
          if-no-files-found: ignore
